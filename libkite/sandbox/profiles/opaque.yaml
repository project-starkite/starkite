# opaque.yaml — built-in opaque sandbox profile (the ladder's first rung).
#
# Goal: sealed compute over the working tree. No egress, no host visibility.
#
# Network mode: loopback
#   gVisor's user-space netstack is active but not bridged to the host.
#   In-sandbox loopback works (a script can run http.server() and connect
#   to it from the same script), but no packet can leave the sandbox and
#   no host resolver is reachable.
#
# Filesystem:
#   - $CWD bound rw at the same host path — the script's only persistent
#     I/O channel.
#   - /tmp tmpfs for scratch, lost on exit.
#   - Nothing else exists: no /etc/*, no TLS roots, no $HOME, no host
#     binaries.
#
# Plumbing the runner adds independently of this file: /proc, /dev, and
# the kite binary bind-mounted at /.kite.

network: loopback

mounts:
  - source: $CWD
    destination: $CWD
    mode: rw
    type: bind

  - destination: /tmp
    type: tmpfs
    mode: rw
