# opaque.yaml — built-in opaque sandbox profile (the ladder's first rung).
#
# Goal: sealed compute over the working tree. No egress, no host visibility.
#
# Network mode: loopback
#   Outbound network is disabled. In-sandbox loopback works, but no packet
#   can leave the sandbox and no host resolver is reachable.
#
# Filesystem:
#   - $CWD bound rw at the same host path — the script's only persistent
#     I/O channel.
#   - /tmp tmpfs for scratch, lost on exit.
#   - Nothing else exists: no /etc/*, no TLS roots, no $HOME, no host
#     binaries.

network: loopback

mounts:
  - source: $CWD
    destination: $CWD
    mode: rw
    type: bind

  - destination: /tmp
    type: tmpfs
    mode: rw
