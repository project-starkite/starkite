# strict.yaml — built-in strict sandbox profile.
#
# Goal: maximally isolated execution. Compute over project files, no
# outbound network, no DNS, no TLS roots, no host inspection.
#
# Network mode: sandbox-loopback
#   gVisor's user-space netstack is active but not bridged to the host
#   network. In-sandbox loopback works (a script can run http.server() or
#   ssh.test_server() and connect to it from the same script), but no
#   packet can leave the sandbox. DNS resolution against host resolvers
#   isn't possible — there's no /etc/resolv.conf and no path to any
#   resolver IP.
#
# Filesystem:
#   - $CWD bound rw at the same host path. The script's only persistent
#     I/O channel.
#   - /tmp tmpfs for scratch. Lost on exit.
#   - No /etc/* mounts. No TLS roots, no DNS config, no nsswitch.
#
# Use case: untrusted compute over project data — parsing, transforms,
# computation against $CWD files. Compose with --permissions=strict for
# defense in depth at both the syscall layer (sandbox) and the module
# call layer (permissions).
#
# Plumbing the runner adds independently of this file: /proc, /dev,
# and the kite binary bind-mounted at /.kite.

network: sandbox-loopback

mounts:
  - source: $CWD
    destination: $CWD
    mode: rw
    type: bind

  - destination: /tmp
    type: tmpfs
    mode: rw
