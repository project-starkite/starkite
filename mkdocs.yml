site_name: Starkite
site_description: Secure Starlark Runtime for System, Cloud, and Agent Automation
site_author: Vladimir Vivien
site_url: https://starkite.ai/

repo_name: project-starkite/starkite
repo_url: https://github.com/project-starkite/starkite
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/starkite-logo.svg
  favicon: assets/images/starkite-logo-small-bg.png
  palette:
    scheme: default
    primary: cyan
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: Fira Code

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Docs:
      - Getting started:
          - Welcome to Starkite: getting-started/index.md
          - Installation:        getting-started/install.md
          - First script:        getting-started/first-script.md
          - Use the CLI:         getting-started/cli.md
      - Fundamentals:
          - Language:       fundamentals/language.md
          - Modules:        fundamentals/modules.md
          - Configuration:  fundamentals/configuration.md
          - Security:
              - Permission: fundamentals/security/permission.md
              - Sandbox:    fundamentals/security/sandbox.md
          - Testing:        fundamentals/testing.md
          - Editions:       fundamentals/editions.md
          - Running scripts: fundamentals/running.md
          - Shell integration: fundamentals/shell-integration.md
      - Core Modules:
          - System & processes:
