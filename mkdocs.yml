site_name: Starkite
site_description: A secure runtime for cloud-native and agentic AI automation with Starlark
site_author: Vladimir Vivien
site_url: https://starkite.dev/

repo_name: project-starkite/starkite
repo_url: https://github.com/project-starkite/starkite
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/starkite-logo-small-bg.png
  favicon: assets/images/starkite-logo-small-bg.png
  palette:
    scheme: default
    primary: cyan
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: Fira Code

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Install: getting-started/install.md
      - Quickstarts:
          - First script:                 getting-started/quickstarts/first-script.md
          - Execute commands:             getting-started/quickstarts/exec.md
          - HTTP client/server:           getting-started/quickstarts/http.md
          - Remote SSH commands:          getting-started/quickstarts/ssh.md
          - Use the kite CLI:             getting-started/quickstarts/cli.md
          - Script permissions: getting-started/quickstarts/permission.md
          - Execution sandbox:         getting-started/quickstarts/sandbox.md
          - Run from container:           getting-started/quickstarts/container.md
          - Kubernetes support:         getting-started/quickstarts/kubernetes.md
          - Build an MCP agent:           getting-started/quickstarts/mcp.md
  - Concepts:
      - Overview: concepts/index.md
      - Editions: concepts/editions.md
      - Permission: concepts/permission.md
      - Sandbox: concepts/sandbox.md
      - Language: concepts/language.md
      - Modules: concepts/modules.md
  - Guides:
      - Overview: guides/index.md
      - CI integration: guides/ci-integration.md
      - Authoring permission profiles: guides/authoring-permission-profiles.md
      - Multi-step automation: guides/multi-step-automation.md
  - References:
      - Overview: references/index.md
      - CLI:
          - Overview: references/cli/index.md
          - run: references/cli/run.md
          - exec: references/cli/exec.md
          - test: references/cli/test.md
          - repl: references/cli/repl.md
          - watch: references/cli/watch.md
          - validate: references/cli/validate.md
          - init: references/cli/init.md
          - version: references/cli/version.md
          - edition: references/cli/edition.md
          - module: references/cli/module.md
          - update: references/cli/update.md
          - kube: references/cli/kube.md
      - Embedding: references/embedding.md
      - API:
          - Overview: references/api/index.md
          - os: references/api/os.md
          - fs: references/api/fs.md
          - http: references/api/http.md
          - ssh: references/api/ssh.md
          - json: references/api/json.md
          - yaml: references/api/yaml.md
          - csv: references/api/csv.md
          - gzip: references/api/gzip.md
          - zip: references/api/zip.md
          - base64: references/api/base64.md
