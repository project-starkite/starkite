site_name: Starkite
site_description: A secure scripting runtime for system, infrastructure, and AI agent automation
site_author: Vladimir Vivien
site_url: https://starkite.dev/

repo_name: project-starkite/starkite
repo_url: https://github.com/project-starkite/starkite
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/starkite-logo.svg
  favicon: assets/images/starkite-logo-small-bg.png
  palette:
    scheme: default
    primary: cyan
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: Fira Code

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Docs:
      - Getting started:
          - Welcome to Starkite: getting-started/index.md
          - Installation:        getting-started/install.md
          - First script:        getting-started/first-script.md
          - Use the CLI:         getting-started/cli.md
      - Fundamentals:
          - Language:       fundamentals/language.md
          - Modules:        fundamentals/modules.md
          - Configuration:  fundamentals/configuration.md
          - Security:
              - Permission: fundamentals/security/permission.md
              - Sandbox:    fundamentals/security/sandbox.md
          - Testing:        fundamentals/testing.md
          - Editions:       fundamentals/editions.md
          - Running scripts: fundamentals/running.md
      - Core Modules:
          - System & processes: core-modules/system.md
          - Logging:            core-modules/logging.md
          - JSON & YAML:        core-modules/json-yaml.md
          - Files:              core-modules/files.md
          - Databases (SQL):    core-modules/sql.md
          - SSH:                core-modules/ssh.md
          - HTTP:
              - Clients: core-modules/http/clients.md
              - Servers: core-modules/http/servers.md
      - Infrastructure:
          - Starkite and Kubernetes: infra/kubernetes.md
          - Operating a cluster:     infra/operations.md
          - Controlling a cluster:   infra/controllers.md
      - AI:
          - Building agents:       ai/agents.md
          - Creating MCP servers:  ai/mcp.md
          - CLI tool provider:     ai/cli-tool.md
  - References:
      - Overview: references/index.md
      - CLI:
          - Overview: references/cli/index.md
          - run: references/cli/run.md
          - exec: references/cli/exec.md
          - test: references/cli/test.md
          - repl: references/cli/repl.md
          - watch: references/cli/watch.md
          - validate: references/cli/validate.md
          - init: references/cli/init.md
          - version: references/cli/version.md
          - edition: references/cli/edition.md
          - module: references/cli/module.md
          - update: references/cli/update.md
          - kube: references/cli/kube.md
      - Module manifest (mod.yaml): references/manifest.md
      - Embedding: references/embedding.md
      - API:
          - Overview: references/api/index.md
          - os: references/api/os.md
          - fs: references/api/fs.md
          - http: references/api/http.md
          - ssh: references/api/ssh.md
          - sql: references/api/sql.md
          - json: references/api/json.md
          - yaml: references/api/yaml.md
          - csv: references/api/csv.md
          - gzip: references/api/gzip.md
          - zip: references/api/zip.md
          - base64: references/api/base64.md
          - hash: references/api/hash.md
          - strings: references/api/strings.md
          - regexp: references/api/regexp.md
          - template: references/api/template.md
          - time: references/api/time.md
          - uuid: references/api/uuid.md
          - fmt: references/api/fmt.md
          - log: references/api/log.md
          - table: references/api/table.md
          - concur: references/api/concur.md
          - retry: references/api/retry.md
          - io: references/api/io.md
          - vars: references/api/vars.md
          - runtime: references/api/runtime.md
          - inventory: references/api/inventory.md
          - test: references/api/test.md
          - k8s: references/api/k8s.md
          - ai: references/api/ai.md
          - mcp: references/api/mcp.md
  - Examples:
