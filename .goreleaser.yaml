version: 2

builds:
  - id: kite
    dir: ./kite
    main: .
    binary: kite
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/project-starkite/starkite/basekite/version.Version={{.Version}}
      - -X github.com/project-starkite/starkite/basekite/version.BuildTime={{.Date}}
      - -X github.com/project-starkite/starkite/basekite/version.GitCommit={{.Commit}}
      - -X github.com/project-starkite/starkite/basekite/version.Edition=all

archives:
  - id: kite
    ids:
      - kite
    formats:
      - binary
    name_template: "kite-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: project-starkite
    name: starkite
  prerelease: auto

kos:
  - repositories:
      - ghcr.io/project-starkite/starkite
    tags:
      - latest
      - "{{.Version}}"
    build: kite
    base_image: cgr.dev/chainguard/static:latest
    platforms:
      - linux/amd64
      - linux/arm64
