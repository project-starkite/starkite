name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            libkite/go.sum
            basekite/go.sum
            cloudkite/go.sum
            aikite/go.sum
            kite/go.sum
            sandbox/gvisor/go.sum

      - name: Build libkite
        run: go build -v ./...
        working-directory: libkite

      - name: Build basekite
        run: go build -v ./...
        working-directory: basekite

      - name: Build cloudkite
        run: go build -v ./...
        working-directory: cloudkite

      - name: Build aikite
        run: go build -v ./...
        working-directory: aikite

      - name: Build kite
        run: go build -v ./...
        working-directory: kite

      - name: Build sandbox/gvisor
        run: go build -v ./...
        working-directory: sandbox/gvisor

      - name: Test libkite
        run: go test -race ./...
        working-directory: libkite

      - name: Test basekite
        run: go test -race ./...
        working-directory: basekite

      - name: Test cloudkite
        run: go test -race ./...
        working-directory: cloudkite

      - name: Test aikite
        run: go test -race ./...
        working-directory: aikite

      - name: Test kite
        run: go test -race ./...
        working-directory: kite

      - name: Test sandbox/gvisor
        run: go test -race ./...
        working-directory: sandbox/gvisor

      - name: Validate install.sh (Syntax & Dry-Run)
        run: |
          sh -n scripts/install.sh
          INSTALL_DRY_RUN=1 ./scripts/install.sh

  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            libkite/go.sum
            basekite/go.sum
            cloudkite/go.sum
            aikite/go.sum
            kite/go.sum

      - name: Build kite on Windows
        run: go build -v .
        working-directory: kite

      - name: Test libkite on Windows
        run: go test ./...
        working-directory: libkite

      - name: Test basekite on Windows
        run: go test ./...
        working-directory: basekite

      - name: Test cloudkite on Windows
        run: go test ./...
        working-directory: cloudkite

      - name: Test aikite on Windows
        run: go test ./...
        working-directory: aikite

      - name: Test kite on Windows
        run: go test ./...
        working-directory: kite

      - name: Validate install.ps1 (Syntax & Dry-Run)
        run: |
          # 1. Parse AST to verify syntax
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts\install.ps1', [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

          # 2. Native Dry-Run
          $env:INSTALL_DRY_RUN = '1'
          .\scripts\install.ps1

  sandbox-integration:
    # Drives the .star sandbox tests under tests/sandbox/ end-to-end:
    # builds kite, configures the kernel for unprivileged user namespaces,
    # invokes `kite test --sandbox` against the test file from a
    # non-$HOME working directory.
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Disable AppArmor unprivileged-userns restriction
        # ubuntu-latest (24.04+) ships with this restriction enabled by
        # default, which blocks gVisor's rootless mode. We turn it off
        # for the duration of this job. Production users would install
        # an AppArmor profile granting `userns,` to the kite binary.
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "after:  $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"

      - name: Run sandbox integration tests
        env:
          STARKITE_SANDBOX_INTEGRATION: "1"
          # Capture gVisor sentry/gofer/boot logs so a sandbox that fails to
          # start is diagnosable from the uploaded artifact below.
          STARKITE_SANDBOX_DEBUG: "/tmp/starkite-sandbox-debug"
        run: go test -v -timeout 5m ./...
        working-directory: tests/sandbox

      - name: Upload gVisor debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-debug-logs
          path: /tmp/starkite-sandbox-debug/
          if-no-files-found: ignore
