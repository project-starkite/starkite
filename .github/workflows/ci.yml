name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Primary Linux Job: Linting, Unit Tests, All Starlark Tests, Landlock & Docker Containment
  linux-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            libkite/go.sum
            basekite/go.sum
            cloudkite/go.sum
            aikite/go.sum
            kite/go.sum
            tests/sandbox/go.sum

      - name: Verify code formatting (gofmt)
        run: |
          DIFFS=$(gofmt -l .)
          if [ -n "$DIFFS" ]; then
            echo "Formatting differences found in the following files:"
            echo "$DIFFS"
            exit 1
          fi

      - name: Run go vet
        run: |
          for dir in libkite basekite cloudkite aikite kite tests/sandbox; do
            echo "=== Vetting $dir ==="
            (cd "$dir" && go vet ./...)
          done

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Build all workspace modules and kite binary
        run: |
          mkdir -p bin
          for dir in libkite basekite cloudkite aikite tests/sandbox; do
            echo "=== Building $dir ==="
            (cd "$dir" && go build -v ./...)
          done
          (cd kite && go build -v -o ../bin/kite .)

      - name: Run Go unit tests with race detection
        run: |
          for dir in libkite basekite cloudkite aikite kite; do
            echo "=== Testing $dir ==="
            (cd "$dir" && go test -race ./...)
          done

      - name: Run all Starkite Starlark tests
        run: |
          echo "=== Running all tests/*_test.star files ==="
          for f in tests/*_test.star; do
            echo "--- Testing $f ---"
            ./bin/kite test "$f" --permissions=allow-all-shell || exit 1
          done

      - name: Run Linux native Landlock sandbox tests
        env:
          STARKITE_SANDBOX_INTEGRATION: "1"
          STARKITE_SANDBOX_DRIVER: "landlock"
        run: go test -v -timeout 5m ./...
        working-directory: tests/sandbox

      - name: Build local container image for testing
        run: make docker-build

      - name: Run Linux Docker container sandbox tests
        env:
          STARKITE_SANDBOX_INTEGRATION: "1"
          STARKITE_SANDBOX_DRIVER: "docker"
        run: go test -v -timeout 5m ./...
        working-directory: tests/sandbox

      - name: Validate install.sh (Syntax & Dry-Run)
        run: |
          sh -n scripts/install.sh
          INSTALL_DRY_RUN=1 ./scripts/install.sh

  # 2. macOS Native Containment: Seatbelt sandbox-exec verification
  macos-sandbox-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run macOS Seatbelt sandbox integration tests
        env:
          STARKITE_SANDBOX_INTEGRATION: "1"
          STARKITE_SANDBOX_DRIVER: "seatbelt"
        run: go test -v -timeout 5m ./...
        working-directory: tests/sandbox

  # 3. Windows Native Validation: Pure PowerShell, Go Tests, All Starlark Tests & Installer Dry-Run
  windows-validation:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            libkite/go.sum
            basekite/go.sum
            cloudkite/go.sum
            aikite/go.sum
            kite/go.sum

      - name: Build kite.exe on Windows
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Set-Location kite
          go build -v -o ..\bin\kite.exe .
          Set-Location ..

      - name: Run Go unit tests on Windows
        run: |
          @("libkite", "basekite", "cloudkite", "aikite", "kite") | ForEach-Object {
            Write-Host "=== Testing $_ on Windows ==="
            Push-Location $_
            go test ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }

      - name: Run all Starkite Starlark tests on Windows
        run: |
          Get-ChildItem -Path tests\*_test.star | ForEach-Object {
            Write-Host "--- Testing $($_.Name) on Windows ---"
            .\bin\kite.exe test $_.FullName --permissions=allow-all-shell
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate install.ps1 (Syntax & Dry-Run)
        run: |
          # 1. Parse AST to verify syntax
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts\install.ps1', [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

          # 2. Native Dry-Run
          $env:INSTALL_DRY_RUN = '1'
          .\scripts\install.ps1
